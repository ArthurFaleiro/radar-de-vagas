name: Radar de Vagas

on:
  schedule:
    - cron: "*/30 * * * *" # a cada 30 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch: # permite rodar na mão pela aba Actions

permissions:
  contents: write # para salvar data/enviadas.json

concurrency:
  group: radar-de-vagas
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Buscar e enviar vagas
        run: npm start
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ao clicar em "Run workflow", consulta todas as fontes na hora
          FORCAR_TODAS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          DISCORD_WEBHOOK_ESTAGIO: ${{ secrets.DISCORD_WEBHOOK_ESTAGIO }}
          DISCORD_WEBHOOK_JUNIOR: ${{ secrets.DISCORD_WEBHOOK_JUNIOR }}
          DISCORD_WEBHOOK_FULLSTACK: ${{ secrets.DISCORD_WEBHOOK_FULLSTACK }}
          DISCORD_WEBHOOK_IA: ${{ secrets.DISCORD_WEBHOOK_IA }}
          DISCORD_WEBHOOK_REMOTO: ${{ secrets.DISCORD_WEBHOOK_REMOTO }}
          DISCORD_WEBHOOK_INTERNACIONAL: ${{ secrets.DISCORD_WEBHOOK_INTERNACIONAL }}
          DISCORD_WEBHOOK_VAGAS_ADMINISTRATIVAS: ${{ secrets.DISCORD_WEBHOOK_VAGAS_ADMINISTRATIVAS }}
          DISCORD_WEBHOOK_ADMIN: ${{ secrets.DISCORD_WEBHOOK_ADMIN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Salvar vagas já enviadas
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/enviadas.json
          git diff --cached --quiet || (git commit -m "chore: atualiza vagas enviadas" && git push)
